<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐龙跑酷小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ground" id="groundDom"></div>
    <div class="dino" id="dino">
        <div class="pixel" style="left:24px;top:0"></div>
        <div class="pixel" style="left:32px;top:0"></div>
        <div class="pixel" style="left:40px;top:0"></div>
        <div class="pixel" style="left:24px;top:8px"></div>
        <div class="pixel" style="left:32px;top:8px"></div>
        <div class="pixel" style="left:40px;top:8px"></div>
        <div class="pixel" style="left:48px;top:8px"></div>
        <div class="pixel" style="left:16px;top:16px"></div>
        <div class="pixel" style="left:24px;top:16px"></div>
        <div class="pixel" style="left:32px;top:16px"></div>
        <div class="pixel" style="left:40px;top:16px"></div>
        <div class="pixel" style="left:16px;top:24px"></div>
        <div class="pixel" style="left:24px;top:24px"></div>
        <div class="pixel" style="left:32px;top:24px"></div>
        <div class="pixel" style="left:16px;top:32px"></div>
        <div class="pixel" style="left:32px;top:32px"></div>
        <div class="pixel" style="left:16px;top:40px"></div>
        <div class="pixel" style="left:32px;top:40px"></div>
        <div class="pixel" style="left:16px;top:48px"></div>
        <div class="pixel" style="left:32px;top:48px"></div>
        <div class="pixel" style="left:0px;top:24px"></div>
        <div class="pixel" style="left:8px;top:24px"></div>
    </div>
    <div class="score-text" id="score">分数：0</div>
    <div class="mode-hint" id="modeHint"></div>
    <div class="terrain-name" id="terrainName"></div>
    <div class="game-tip" id="tip">点击屏幕开始游戏</div>

    <script type="module" src="main.js"></script>
</body>
</html>
